<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Çipil Donut Pro - E-Posta Korumalı</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            font-family: 'Arial', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ANA GİRİŞ VE LOBİ MENÜSÜ */
        #giris-ekrani {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #121212 0%, #1e1e2e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            text-align: center;
        }

        .input-kutusu {
            width: 250px;
            padding: 12px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #1a1a1a;
            color: white;
            text-align: center;
            margin-bottom: 12px;
        }

        .buton {
            width: 276px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: 0.2s;
        }
        .buton:active { transform: scale(0.98); }

        /* ODA BEKLEME EKRANI */
        #oda-ekrani {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #151522;
            z-index: 9998;
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #oyuncu-listesi {
            width: 80%;
            max-height: 150px;
            background: #0f0f1a;
            border: 1px solid #3897f0;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            overflow-y: auto;
        }

        /* GERÇEK OYUN ALANI */
        #oyun-alani {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #121212;
        }

        #ust-panel {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            font-weight: bold;
            z-index: 10;
        }

        /* YANDI CANLI LİDERLİK TABLOSU */
        #liderlik-tablosu {
            position: absolute;
            top: 75px;
            right: 5%;
            width: 150px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #ffcc00;
            border-radius: 8px;
            color: white;
            padding: 8px;
            font-size: 12px;
            z-index: 20;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        #oyun-kutusu {
            position: absolute;
            top: 75px;
            left: 5%;
            width: 90%;
            height: calc(100% - 215px);
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Oyuncu (Yeşil Kare) */
        #sepet {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background-color: #00ffcc;
            border-radius: 10px;
            box-shadow: 0 0 15px #00ffcc;
        }

        .top {
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: #ff3333;
            border-radius: 50%;
            box-shadow: 0 0 12px #ff3333;
        }

        /* KONTROL BUTONLARI */
        #butonlar-alani {
            position: absolute;
            bottom: 15px;
            width: 90%;
            left: 5%;
            display: flex;
            justify-content: space-between;
        }

        .kontrol-butonu {
            width: 46%;
            padding: 22px 0;
            font-size: 22px;
            font-weight: bold;
            color: #00ffcc;
            background-color: #1a1a1a;
            border: 2px solid #00ffcc;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            touch-action: manipulation;
        }
    </style>
</head>
<body>

    <div id="giris-ekrani">
        <h1 style="font-size: 42px; margin-bottom: 5px; text-shadow: 0 0 15px #ff5722; color: #ff5722;">Çipil Donut</h1>
        <p style="color: #aaa; margin-bottom: 20px; font-size: 14px;">Lütfen Kayıtlı E-Posta Adresinizle Giriş Yapın</p>
        
        <input type="email" id="oyuncu-eposta" placeholder="Kayıtlı E-Posta Adresin..." class="input-kutusu">
        <input type="text" id="oyuncu-adi" placeholder="Oyuncu Adın (Opsiyonel)..." class="input-kutusu">
        <input type="password" id="oda-sifresi" placeholder="Oda Şifresi..." class="input-kutusu">
        
        <label style="font-size: 12px; color: #aaa; margin-bottom: 4px;">Maksimum Oyuncu Sınırı:</label>
        <select id="max-oyuncu" class="input-kutusu" style="width: 276px;">
            <option value="20">20 Oyuncu Odası</option>
            <option value="50">50 Oyuncu (Büyük Kaos)</option>
        </select>

        <button onclick="odaYonetimi('kur')" class="buton" style="background-color: #a83294;">👑 Oda Kur (Lobide Bekle)</button>
        <button onclick="odaYonetimi('katil')" class="buton" style="background-color: #3897f0;">⚡ Şifre Gir ve Bağlan</button>
        <div style="margin: 10px 0; color: #555;">──────── VEYA ────────</div>
        <button onclick="odaYonetimi('alistirma')" class="buton" style="background-color: #222; margin-top: 0; color: #00ffcc; border: 1px solid #00ffcc;">🎯 Alıştırma (Tek Kişilik Mod)</button>
    </div>

    <div id="oda-ekrani">
        <h2 id="lobi-baslik" style="color: #00ffcc;">Oda Kuruldu!</h2>
        <p id="oda-kapasite" style="font-weight: bold; color: #ffcc00;"></p>
        
        <div id="oyuncu-listesi">
            <div id="liste-icerik" style="line-height: 22px;"></div>
        </div>

        <button id="mac-baslat-btn" onclick="maciBaslat()" class="buton" style="background-color: #00ffcc; color: #121212; display: none; width: 280px; font-size: 18px;">
            🚀 MAÇI BAŞLAT (Herkes Girsin)
        </button>
    </div>

    <div id="oyun-alani">
        <div id="ust-panel">
            <span id="aktif-oyuncu" style="color: #00ffcc;">-</span> | 
            SKOR: <span id="skor-tabelasi">0</span> | 
            CAN: <span id="can-tabelasi">3</span>
        </div>

        <div id="liderlik-tablosu">
            <b style="color: #ffcc00;">🏆 SIRALAMA</b><br>
            <div id="liderler-listesi" style="margin-top: 5px; line-height: 18px;"></div>
        </div>

        <div id="oyun-kutusu">
            <div id="sepet"></div>
        </div>

        <div id="butonlar-alani">
            <div class="kontrol-butonu" id="btn-sol">SOL</div>
            <div class="kontrol-butonu" id="btn-sag">SAG</div>
        </div>
    </div>

    <script>
        // TEK TEK SENİNLE İLGİLİ OLAN 50 ÖZEL E-POSTA LİSTESİ
        const izinliEpostalar = [
            "cipil@donut.com", "cipildonut@io.com", "serefturancelik@sudo.com", "robotistan@cipil.com", 
            "arduino@leonardo.com", "oruldu@altinordu.com", "ordu@cipil.com", "deneyap@turkiye.com",
            "vscode@codeon.com", "codepen@donut.com", "unity@cipilgames.com", "godot@cipil.com",
            "minecraft@donut.com", "brawlstars@cipil.com", "roblox@donut.com", "clashroyale@cipil.com",
            "valorant@cipil.com", "capcut@editor.com", "blynk@iotcipil.com", "dcmotor@pervane.com",
            "havya@lehimci.com", "abim@leonardo.com", "baba@oyuncu.com", "anne@ev.com",
            "gokce@guvenlik.com", "codeon@ide.com", "bursluluk@sinav.com", "dorduncusinif@okul.com",
            "4sinif@scholarship.com", "altinorduburs@sinav.com", "2wd@araba.com", "seffafaraba@motor.com",
            "mesafesensoru@pin.com", "pin891011@arduino.com", "tftlcd@ekran.com", "oleddisplay@robotistan.com",
            "joystick@module.com", "esp32@micro.com", "mblock@kodlama.com", "prosedurel@generation.com",
            "obstacle@avoidance.com", "consoletycoon@game.com", "reels@creator.com", "yapayzeka@video.com",
            "sandalye@kaplama.com", "upholstery@repair.com", "t3kys@deneyap.com", "esınav@belge.com",
            "turkcell@aile.com", "cipilpro@donut.com"
        ];

        let skor = 0;
        let can = 3;
        let oyunAktif = false;
        let sepetX = 50;
        const sepetHizi = 1.8; 
        let oyunModu = "cok"; 
        let lobiIsim = "";
        let rakipler = [];
        
        let solBasili = false;
        let sagBasili = false;

        function odaYonetimi(aksiyon) {
            // E-posta kontrolü
            let eposta = document.getElementById("oyuncu-eposta").value.trim().toLowerCase();
            lobiIsim = document.getElementById("oyuncu-adi").value.trim();
            let sifre = document.getElementById("oda-sifresi").value.trim();
            let limit = parseInt(document.getElementById("max-oyuncu").value);

            if (!izinliEpostalar.includes(eposta)) {
                alert("Bu e-posta kayıtlı değil balım! Giriş reddedildi.");
                return;
            }

            if (lobiIsim === "") lobiIsim = eposta.split("@")[0]; // İsim yazmadıysa e-postanın başını alır

            if (aksiyon === "alistirma") {
                oyunModu = "alistirma";
                can = "∞"; 
                maciBaslat();
                return;
            }

            if (sifre === "") {
                alert("Balım, şifreli odaya girmek veya kurmak için bir şifre yazmalısın!");
                return;
            }

            document.getElementById("giris-ekrani").style.display = "none";
            document.getElementById("oda-ekrani").style.display = "flex";

            rakipler = [];
            for (let i = 1; i < limit; i++) {
                rakipler.push({
                    isim: "Bot_" + Math.floor(Math.random() * 899 + 100),
                    skor: 0
                });
            }

            if (aksiyon === "kur") {
                document.getElementById("lobi-baslik").innerText = "👑 ODA LOBİSİ (Şifre: " + sifre + ")";
                document.getElementById("oda-kapasite").innerText = "Durum: Doluyor... Sınır: " + limit + " Kişi";
                document.getElementById("mac-baslat-btn").style.display = "block";
                
                let icerik = `<span style="color:#00ffcc">• ${lobiIsim} (Kuran)</span><br>`;
                rakipler.slice(0, 5).forEach(r => {
                    icerik += `<span style="color:#aaa">• ${r.isim} (Bağlandı)</span><br>`;
                });
                document.getElementById("liste-icerik").innerHTML = icerik;

            } else if (aksiyon === "katil") {
                document.getElementById("lobi-baslik").innerText = "⚡ ODAYA GİRİLDİ";
                document.getElementById("oda-kapasite").innerText = "Oda sahibi maçı başlatıyor...";
                document.getElementById("liste-icerik").innerHTML = `<span>• ${lobiIsim}</span><br><span style="color:#aaa">• Kurucu bekleniyor...</span>`;
                setTimeout(() => { maciBaslat(); }, 2000);
            }
        }

        function maciBaslat() {
            document.getElementById("giris-ekrani").style.display = "none";
            document.getElementById("oda-ekrani").style.display = "none";
            document.getElementById("oyun-alani").style.display = "block";
            document.getElementById("aktif-oyuncu").innerText = lobiIsim;
            document.getElementById("can-tabelasi").innerText = can;

            if (oyunModu === "alistirma") {
                document.getElementById("liderlik-tablosu").style.display = "none";
            } else {
                document.getElementById("liderlik-tablosu").style.display = "block";
                liderlikTablosunuGuncelle();
            }

            oyunAktif = true;
            guncellemeDongusu();
            topDusurucuDöngü();
            botMotorunuBaslat();
        }

        const sepetElement = document.getElementById("sepet");

        function guncellemeDongusu() {
            if (!oyunAktif) return;

            if (solBasili && sepetX > 4) {
                sepetX -= sepetHizi;
            }
            if (sagBasili && sepetX < 96) {
                sepetX += sepetHizi;
            }
            sepetElement.style.left = sepetX + "%";
            requestAnimationFrame(guncellemeDongusu);
        }

        document.getElementById("btn-sol").addEventListener("touchstart", (e) => { e.preventDefault(); solBasili = true; });
        document.getElementById("btn-sol").addEventListener("touchend", () => { solBasili = false; });
        document.getElementById("btn-sag").addEventListener("touchstart", (e) => { e.preventDefault(); sagBasili = true; });
        document.getElementById("btn-sag").addEventListener("touchend", () => { sagBasili = false; });

        document.getElementById("btn-sol").addEventListener("mousedown", () => { solBasili = true; });
        document.getElementById("btn-sol").addEventListener("mouseup", () => { solBasili = false; });
        document.getElementById("btn-sol").addEventListener("mouseleave", () => { solBasili = false; });
        document.getElementById("btn-sag").addEventListener("mousedown", () => { sagBasili = true; });
        document.getElementById("btn-sag").addEventListener("mouseup", () => { sagBasili = false; });
        document.getElementById("btn-sag").addEventListener("mouseleave", () => { sagBasili = false; });

        function botMotorunuBaslat() {
            if (oyunModu === "alistirma") return;
            setInterval(() => {
                if (oyunAktif) {
                    rakipler.forEach(r => {
                        if (Math.random() > 0.35) {
                            r.skor += 4;
                        }
                    });
                    liderlikTablosunuGuncelle();
                }
            }, 600);
        }

        function liderlikTablosunuGuncelle() {
            let tumSkorlar = [{ isim: "Sen", skor: skor }, ...rakipler];
            tumSkorlar.sort((a, b) => b.skor - a.skor);

            let benimSiram = tumSkorlar.findIndex(x => x.isim === "Sen") + 1;

            let html = `<b style="color:#ffcc00;">Sıran: #${benimSiram}</b><hr style="border:0.5px solid #333;">`;
            tumSkorlar.slice(0, 5).forEach((o, index) => {
                let renk = o.isim === "Sen" ? "color:#00ffcc; font-weight:bold;" : "color:#fff;";
                html += `<div style="${renk}">${index + 1}. ${o.isim}: ${o.skor}</div>`;
            });
            document.getElementById("liderler-listesi").innerHTML = html;
        }

        function topDusurucuDöngü() {
            setInterval(() => {
                if (oyunAktif) topOlustur();
            }, 650);
        }

        function topOlustur() {
            const kutu = document.getElementById("oyun-kutusu");
            const top = document.createElement("div");
            top.classList.add("top");

            const rastgeleX = Math.random() * (kutu.clientWidth - 24);
            top.style.left = rastgeleX + "px";
            top.style.top = "0px";
            kutu.appendChild(top);

            let topY = 0;
            const dusmeHizi = Math.random() * 3 + 8; 

            function hareket() {
                if (!oyunAktif) { top.remove(); return; }

                topY += dusmeHizi;
                top.style.top = topY + "px";

                const sepetSol = sepetElement.offsetLeft;
                const sepetSag = sepetSol + sepetElement.clientWidth;
                const topSol = top.offsetLeft;
                const topSag = topSol + top.clientWidth;

                if (topY >= (kutu.clientHeight - 70) && topY <= (kutu.clientHeight - 20)) {
                    if (topSag >= sepetSol && topSol <= sepetSag) {
                        skor += 4; 
                        document.getElementById("skor-tabelasi").innerText = skor;
                        if (oyunModu !== "alistirma") liderlikTablosunuGuncelle();
                        top.remove();
                        return;
                    }
                }

                if (topY > kutu.clientHeight) {
                    top.remove();
                    if (oyunModu !== "alistirma") {
                        can--;
                        document.getElementById("can-tabelasi").innerText = can;
                        if (can <= 0) {
                            oyunAktif = false;
                            alert("Oyun Bitti Balım! Toplam Skorun: " + skor);
                            location.reload();
                        }
                    }
                } else {
                    requestAnimationFrame(hareket);
                }
            }
            requestAnimationFrame(hareket);
        }
    </script>
</body>
</html>

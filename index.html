<div id="giris-ekrani" style="
    position: fixed; 
    top: 0; left: 0; 
    width: 100%; height: 100%; 
    background: linear-gradient(135deg, #121212 0%, #1e1e2e 100%); 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    z-index: 9999; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: white;">
    
    <h1 style="font-size: 36px; margin-bottom: 10px; text-shadow: 0 0 10px #ff5722; color: #ff5722;">Çipil Donut</h1>
    <p style="color: #aaa; margin-bottom: 30px; font-size: 16px;">Hoş geldin balım! Giriş yöntemini seç:</p>

    <button onclick="misafirGirisi()" style="
        width: 260px; 
        padding: 14px; 
        font-size: 16px; 
        font-weight: bold; 
        background-color: #3897f0; 
        color: white; 
        border: none; 
        border-radius: 8px; 
        cursor: pointer; 
        box-shadow: 0 4px 15px rgba(56, 151, 240, 0.4);
        transition: transform 0.2s;">
        Misafir Olarak Devam Et
    </button>

    <div style="margin: 20px 0; color: #555;">──────── OR ────────</div>

    <input type="text" id="oyuncu-adi" placeholder="Veya adını yaz..." style="
        width: 236px; 
        padding: 12px; 
        font-size: 15px; 
        border-radius: 8px; 
        border: 1px solid #333; 
        background-color: #1a1a1a; 
        color: white; 
        text-align: center;
        margin-bottom: 12px;">

    <button onclick="isimleGiris()" style="
        width: 260px; 
        padding: 12px; 
        font-size: 15px; 
        background-color: transparent; 
        color: #3897f0; 
        border: 1px solid #3897f0; 
        border-radius: 8px; 
        cursor: pointer;
        font-weight: 600;">
        Kullanıcı Adıyla Gir
    </button>
</div>

<script>
// Misafir olarak tıklandığında çalışacak fonksiyon
function misafirGirisi() {
    const misafirID = "Misafir_" + Math.floor(Math.random() * 90000 + 10000);
    console.log("Instagram Tarzı Giriş Başarılı! ID: " + misafirID);
    
    // Giriş ekranını ekrandan kaldırır
    document.getElementById("giris-ekrani").style.removeProperty("display");
    document.getElementById("giris-ekrani").style.display = "none";
    
    // OYUNU BAŞLATMA KODUNU BURAYA BAĞLA
    // Örnek: oyunuBaslat(misafirID, "Misafir Oyuncu");
}

// İsim yazarak girmek isteyenler için fonksiyon
function isimleGiris() {
    const girilenIsim = document.getElementById("oyuncu-adi").value.trim();
    if (girilenIsim === "") {
        alert("Balım, lütfen bir kullanıcı adı yaz ya da direkt Misafir butonuna bas!");
        return;
    }
    const oyuncuID = "Oyuncu_" + Math.floor(Math.random() * 90000 + 10000);
    
    document.getElementById("giris-ekrani").style.display = "none";
    
    // OYUNU BAŞLATMA KODUNU BURAYA BAĞLA
    // Örnek: oyunuBaslat(oyuncuID, girilenIsim);
}
</script>
